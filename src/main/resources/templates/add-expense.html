<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Add Expense - Smart Expense Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background-color: #f4f7fc;
        }

        .expense-box {
            width: 550px;
            margin: 50px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.12);
        }

        .title {
            color: #0d6efd;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="expense-box">

    <h2 class="text-center title">
        💰 Smart Expense Tracker
    </h2>

    <h4 class="text-center mt-3">
        Add Expense
    </h4>

    <hr>

    <form th:action="@{/add-expense}"
          th:object="${expense}"
          method="post">

        <!-- CSRF Security Token -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <!-- Title -->

        <div class="mb-3">

            <label class="form-label">
                Expense Title
            </label>

            <input type="text"
                   th:field="*{title}"
                   class="form-control"
                   placeholder="Example: Grocery Shopping"
                   required>

        </div>


        <!-- Amount -->

        <div class="mb-3">

            <label class="form-label">
                Amount (₹)
            </label>

            <input type="number"
                   th:field="*{amount}"
                   class="form-control"
                   placeholder="Enter amount"
                   min="0"
                   step="0.01"
                   required>

        </div>


        <!-- Category -->

        <div class="mb-3">

            <label class="form-label">
                Category
            </label>

            <select th:field="*{category}"
                    class="form-select"
                    required>

                <option value="">
                    Select Category
                </option>

                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Education">Education</option>
                <option value="Health">Health</option>
                <option value="Other">Other</option>

            </select>

        </div>


        <!-- Date -->

        <div class="mb-3">

            <label class="form-label">
                Date
            </label>

            <input type="date"
                   th:field="*{date}"
                   class="form-control">

        </div>


        <!-- Description -->

        <div class="mb-3">

            <label class="form-label">
                Description
            </label>

            <textarea th:field="*{description}"
                      class="form-control"
                      rows="3"
                      placeholder="Enter additional details"></textarea>

        </div>


        <!-- Submit -->

        <div class="d-grid gap-2">

            <button type="submit"
                    class="btn btn-primary">
                Add Expense
            </button>

            <a th:href="@{/dashboard}"
               class="btn btn-secondary">
                Back to Dashboard
            </a>

        </div>

    </form>

</div>

</body>

</html>
